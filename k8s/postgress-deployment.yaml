apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
          - containerPorts: 5432
        env:
          - secretRef:
            name: postgres-secret
        volumeMounts:
          - name: postgres-storage
            mountPath: /var/lib/postgres/data
    volumes:
      - name: postgres-storage
        pesistentVolumeClaim:
          claimName: postgres-pvc
